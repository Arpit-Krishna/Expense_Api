spring.application.name=Expense_Api
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
# Off so the app can start (and /health answers) even when the database is unreachable,
# which is how the app behaved before. Indexes are not required for correctness.
spring.data.mongodb.auto-index-creation=false

# Set JWT_SECRET on Render (32+ random characters). Without it the app signs tokens with a
# random key, so everyone is logged out on every restart.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://expensify-psi.vercel.app}

# Failed logins allowed per username and per IP before a 15-minute lockout.
app.auth.max-failed-logins=${MAX_FAILED_LOGINS:10}

# Never send stack traces or exception details to clients.
server.error.include-stacktrace=never
server.error.include-message=never
# Render sits behind a proxy; trust X-Forwarded-For so the login limiter sees real client IPs.
server.forward-headers-strategy=native

# Emails (weekly check-in, budget alerts, payment reminders) stay off until a provider key is set.
# Brevo (preferred, no domain needed): set BREVO_API_KEY and MAIL_FROM to a sender you verified in
# Brevo, e.g. "Expensify <you@gmail.com>".
# Resend: set RESEND_API_KEY. Its default sender only delivers to your own Resend address; to email
# anyone, verify a domain in Resend and set MAIL_FROM to an address on it.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.url=${APP_URL:https://expensify-psi.vercel.app}
