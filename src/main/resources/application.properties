spring.application.name=Expense_Api
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# Set JWT_SECRET on Render (32+ random characters). The fallback keeps tokens issued
# before this change valid; changing the secret logs everyone out once.
app.jwt.secret=${JWT_SECRET:qwerty@1234567890_ThisIsA256BitSecretKey!}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://expensify-psi.vercel.app}
