version: '3.8'

# Local development: runs the API against a local MongoDB.
# To use Atlas instead, put SPRING_DATA_MONGODB_URI=... in a .env file (not committed).
services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  springboot-app:
    build: .
    container_name: springboot-app
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongodb:27017/Expences}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-characters}

volumes:
  mongo_data:
